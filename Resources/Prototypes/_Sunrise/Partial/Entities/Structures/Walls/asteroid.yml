# Частичные прототипы возвращают прежние визуалы всех AsteroidRock и наследующихся от них MeteorRock.

- type: !PartialOnly entity
  id: AsteroidRock
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Icon
    sprite: _Sunrise/Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers: !Clear
    - state: rock_asteroid
    - map: ["enum.EdgeLayer.South"]
      state: rock_asteroid_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_asteroid_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_asteroid_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_asteroid_west

# IronRock и WallRock используют новые Wizden RSI и не должны наследовать старые
# слои SmoothEdge от AsteroidRock. Игровые компоненты AsteroidRock для IronRock
# продублированы здесь, чтобы смена родителя не меняла прочность и добычу.
- type: !PartialOnly entity
  id: IronRock
  parent: BaseAsteroidRock
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe

- type: !PartialOnly entity
  id: WallRock
  parent: BaseAsteroidRock

