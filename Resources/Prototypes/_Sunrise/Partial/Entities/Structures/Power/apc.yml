- type: !PartialOnly entity
  id: BaseAPC
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Sunrise/Structures/Power/apc.rsi
    layers: !Clear
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: lock0-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.InterfaceLock"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.PanelLock"]
      visible: false
    - state: lock1-locked #when these are implemented get actual sprites.
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Lighting"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Environment"]
      visible: false
  - type: PowerMonitoringDevice
    group: APC
    sourceNode: input
    loadNode: output
    collectionName: apc
    sprite: _Sunrise/Structures/Power/apc.rsi
    state: static

- type: !PartialOnly entity
  id: APCFrame
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Power/apc.rsi
    state: frame
