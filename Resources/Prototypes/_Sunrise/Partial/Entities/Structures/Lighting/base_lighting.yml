# Частичные прототипы сохраняют визуалы освещения Sunrise поверх обновлений Wizden.

- type: !PartialOnly entity
  id: BaseWallLight
  components:
  - type: SunriseDamagePopup
    damagePopupType: SmallFloating
    isStructure: true
  - type: BloomOverlayVisuals

- type: !PartialOnly entity
  id: AlwaysPoweredWallLight
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/lighting/light_tube.rsi
    offset: 0, 0
    layers: !Clear
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded

- type: !PartialOnly entity
  id: PoweredlightEmpty
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/lighting/light_tube.rsi
    offset: 0, 0

- type: !PartialOnly entity
  id: SmallLight
  components:
  - type: HolidayVisuals
    holidays:
      festive:
      - WinterPresents
  - type: HolidayRsiSwap
    sprite:
      festive: _Sunrise/Structures/Wallmounts/Lighting/light_small_gift.rsi

- type: !PartialOnly entity
  id: PoweredSmallLightEmpty
  components:
  - type: HolidayVisuals
    holidays:
      festive:
      - WinterPresents
  - type: HolidayRsiSwap
    sprite:
      festive: _Sunrise/Structures/Wallmounts/Lighting/light_small_gift.rsi

- type: !PartialOnly entity
  id: EmergencyLight
  components:
  - type: PointLight
    radius: 7
    energy: 1
    offset: "0, 0.4"
