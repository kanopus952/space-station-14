# Совместимость механики шлюзов Sunrise с обновлёнными прототипами Wizden.

- type: !PartialOnly entity
  id: Airlock
  parent: [BaseStructure, BaseDeltaPressurePlasma]
  components:
  - type: Ricochetable
    chance: 1
  - type: Pierceable
    level: HardenedMetal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.46,-0.46,0.46,0.46"

- type: !PartialOnly entity
  id: AirlockGlass
  parent: [Airlock, BaseDeltaPressureReinforcedPlasmaQuarter]
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.46,-0.46,0.46,0.46"

- type: !PartialOnly entity
  id: HighSecDoor
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.46,-0.46,0.46,0.46"
  - type: PlacementReplacement
    key: walls

- type: !PartialOnly entity
  id: AirlockXenoborg
  parent: AirlockUnlitVisibleFalse
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/xenoborg.rsi
    layers: !Remove

- type: !PartialOnly entity
  id: AirlockHatchSyndicate
  parent: AirlockUnlitVisibleFalse
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/hatch_syndicate.rsi
    layers: !Remove

- type: !PartialOnly entity
  id: AirlockXeno
  parent: AirlockUnlitVisibleFalse
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/xeno.rsi
    layers: !Remove

- type: !PartialOnly entity
  id: AirlockGlassXeno
  parent: AirlockUnlitVisibleFalse
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Doors/Airlocks/Glass/xeno.rsi
    layers: !Remove
