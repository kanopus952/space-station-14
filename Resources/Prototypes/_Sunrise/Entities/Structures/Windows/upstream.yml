# Совместимость механики окон Sunrise с обновлёнными прототипами Wizden.

- type: !PartialOnly entity
  id: BaseWindowStructure
  components:
  - type: Ricochetable
    chance: 0.7

- type: !PartialOnly entity
  id: BaseWindowStructureDirectional
  components:
  - type: Tag
    tags:
    - Directional

- type: !PartialOnly entity
  id: WindowFrostedDirectional
  components:
  - type: Occluder
    polygon:
    - "-0.5,-0.28125"
    - "0.5,-0.28125"
    - "0.5,-0.5"
    - "-0.5,-0.5"

- type: !PartialOnly entity
  id: WindowDiagonal
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices: !Clear
          - "0.5,-0.5"
          - "-0.4,-0.5"
          - "-0.4,0.1"
          - "0.5,0.5"

- type: !PartialOnly entity
  id: PlastitaniumWindow
  components:
  - type: Repairable
    fuelCost: !Remove
    doAfterDelay: 5

- type: !PartialOnly entity
  id: PlastitaniumWindowDiagonalBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices: !Clear
          - "0.5,-0.5"
          - "-0.4,-0.5"
          - "-0.4,0.1"
          - "0.5,0.5"

- type: !PartialOnly entity
  id: PlastitaniumWindowDiagonal
  components:
  - type: Repairable
    fuelCost: !Remove
    doAfterDelay: 5
