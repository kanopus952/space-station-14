# Частичные прототипы сохраняют визуалы стен Sunrise поверх обновлений Wizden.

- type: !PartialOnly entity
  id: WallPlastitaniumIndestructible
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/plastitanium.rsi
  - type: Icon
    sprite: _Sunrise/Structures/Walls/plastitanium.rsi

- type: !PartialOnly entity
  id: WallPlastitaniumDiagonalIndestructible
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/plastitanium_diagonal.rsi
  - type: Icon
    sprite: _Sunrise/Structures/Walls/plastitanium_diagonal.rsi

- type: !PartialOnly entity
