# Панели тревоги используют состояния RSI Sunrise вместо новых раздельных спрайтов Wizden.

- type: !PartialOnly entity
  id: AirAlarm
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/air_monitors.rsi
    offset: 0, 0
    layers: !Clear
    - state: alarmp
      map: ["airAlarmBase"]
    - state: alarm0
      map: ["airAlarmState"]
    - state: alarmx
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: !PartialOnly entity
  id: AirAlarmAssembly
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/air_monitors.rsi
    layers: !Clear
    - state: alarm_b1
      map: ["enum.ConstructionVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          assembly: { state: alarm_b1 }
          electronics: { state: alarm_b1 }

- type: !PartialOnly entity
  id: FireAlarm
  components:
  - type: AtmosAlarmableVisuals
    alarmStates:
      Normal: fire_off
      Warning: fire_off
      Danger: fire_on
      Emagged: fire_emagged
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/air_monitors.rsi
    offset: 0, 0
    layers: !Clear
    - state: fire0
      map: ["fireAlarmBase"]
    - state: fire_off
      map: ["fireAlarmState"]
    - state: fire_b2
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: !PartialOnly entity
  id: FireAlarmAssembly
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/air_monitors.rsi
    layers: !Clear
    - state: fire_b1
      map: ["enum.ConstructionVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          assembly: { state: fire_b1 }
          electronics: { state: fire_b2 }
